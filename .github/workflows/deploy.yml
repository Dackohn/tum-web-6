name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, lab7]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── Build current version → dist/ ──────────────────────────────────
      - name: Build current version
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # ── Snapshot v1: basic app with storage, no filters (Apr 30) ───────
      - name: Checkout snapshot v1
        run: git worktree add /tmp/snap-v1 71e679f

      - name: Build snapshot v1
        working-directory: /tmp/snap-v1
        run: |
          npm install --legacy-peer-deps
          VITE_BASE_URL=/${{ github.event.repository.name }}/v1/ npm run build

      - name: Copy snapshot v1 into dist
        run: |
          mkdir -p dist/v1
          cp -r /tmp/snap-v1/dist/. dist/v1/
          git worktree remove --force /tmp/snap-v1

      # ── Snapshot v2: pipelines added, pre-redesign (May 3) ─────────────
      - name: Checkout snapshot v2
        run: git worktree add /tmp/snap-v2 cd4804b

      - name: Build snapshot v2
        working-directory: /tmp/snap-v2
        run: |
          npm install --legacy-peer-deps
          VITE_BASE_URL=/${{ github.event.repository.name }}/v2/ npm run build

      - name: Copy snapshot v2 into dist
        run: |
          mkdir -p dist/v2
          cp -r /tmp/snap-v2/dist/. dist/v2/
          git worktree remove --force /tmp/snap-v2

      # ── lab7: backend-integrated version ───────────────────────────────
      - name: Checkout lab7 branch
        run: git worktree add /tmp/snap-lab7 origin/lab7

      - name: Build lab7
        working-directory: /tmp/snap-lab7
        run: |
          npm install --legacy-peer-deps
          VITE_BASE_URL=/${{ github.event.repository.name }}/lab7/ \
          VITE_API_BASE=${{ vars.VITE_API_BASE }} \
          npm run build

      - name: Copy lab7 into dist
        run: |
          mkdir -p dist/lab7
          cp -r /tmp/snap-lab7/dist/. dist/lab7/
          git worktree remove --force /tmp/snap-lab7

      # ── Deploy all versions together ────────────────────────────────────
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
